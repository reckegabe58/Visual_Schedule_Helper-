<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Timer - Teacher Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/timer.css">
</head>
<body>
    <!-- Setup Screen -->
    <div class="timer-setup" id="timer-setup">
        <header class="timer-header">
            <a href="index.html" class="back-link">
                <span class="material-symbols-outlined">arrow_back</span>
                Dashboard
            </a>
            <h1>Visual Timer</h1>
        </header>

        <div class="setup-container">
            <h2>Set Your Timer</h2>

            <!-- Quick Presets -->
            <div class="preset-buttons">
                <button class="preset-btn" data-minutes="1">1 min</button>
                <button class="preset-btn" data-minutes="2">2 min</button>
                <button class="preset-btn" data-minutes="5">5 min</button>
                <button class="preset-btn" data-minutes="10">10 min</button>
                <button class="preset-btn" data-minutes="15">15 min</button>
                <button class="preset-btn" data-minutes="20">20 min</button>
                <button class="preset-btn" data-minutes="30">30 min</button>
                <button class="preset-btn" data-minutes="45">45 min</button>
            </div>

            <!-- Custom Time Input -->
            <div class="custom-time">
                <label>Or set custom time:</label>
                <div class="time-inputs">
                    <div class="time-input-group">
                        <input type="number" id="minutes-input" min="0" max="99" value="5">
                        <span>minutes</span>
                    </div>
                    <div class="time-input-group">
                        <input type="number" id="seconds-input" min="0" max="59" value="0">
                        <span>seconds</span>
                    </div>
                </div>
            </div>

            <!-- Sound Toggle -->
            <div class="sound-toggle">
                <label class="toggle-label">
                    <input type="checkbox" id="sound-enabled" checked>
                    <span class="toggle-switch"></span>
                    <span>Sound Effects</span>
                </label>
            </div>

            <!-- Start Button -->
            <button class="start-btn" id="start-timer">
                <span class="material-symbols-outlined">play_arrow</span>
                Start Timer
            </button>
        </div>
    </div>

    <!-- Timer Display (Full Screen when running) -->
    <div class="timer-display hidden" id="timer-display">
        <!-- Pizza/Pie Timer Visual -->
        <div class="timer-visual">
            <svg class="pie-timer" viewBox="0 0 100 100" id="pie-timer">
                <!-- Segments will be generated by JS -->
            </svg>
            <div class="timer-center">
                <div class="time-remaining" id="time-remaining">5:00</div>
                <div class="timer-label" id="timer-label">remaining</div>
            </div>
        </div>

        <!-- Controls (shown at bottom) -->
        <div class="timer-controls">
            <button class="control-btn" id="pause-btn" title="Pause">
                <span class="material-symbols-outlined">pause</span>
            </button>
            <button class="control-btn" id="stop-btn" title="Stop">
                <span class="material-symbols-outlined">stop</span>
            </button>
            <button class="control-btn" id="add-time-btn" title="Add 1 minute">
                <span class="material-symbols-outlined">more_time</span>
            </button>
        </div>
    </div>

    <!-- Celebration Overlay -->
    <div class="celebration hidden" id="celebration">
        <canvas id="confetti-canvas"></canvas>
        <div class="celebration-content">
            <div class="celebration-icon">🎉</div>
            <h2>Time's Up!</h2>
            <button class="done-btn" id="done-btn">
                <span class="material-symbols-outlined">check</span>
                Done
            </button>
        </div>
    </div>

    <script src="scripts/timer.js"></script>
</body>
</html>
